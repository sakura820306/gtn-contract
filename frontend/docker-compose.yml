version: '3.8'

services:
  frontend:
    build: .
    container_name: gtn-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - gtn-network

  nginx:
    image: nginx:alpine
    container_name: gtn-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - gtn-network

networks:
  gtn-network:
    driver: bridge