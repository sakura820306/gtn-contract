version: '3.8'

services:
  api:
    build: .
    container_name: gtn-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - gtn-network

networks:
  gtn-network:
    driver: bridge