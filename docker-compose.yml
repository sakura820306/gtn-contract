version: '3.8'

services:
  # API 服務
  api:
    build: ./api
    container_name: gtn-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=dev
    env_file:
      - ./api/.env.dev
    volumes:
      - ./api:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - gtn-network
      - postchain-mainnet
    depends_on:
      blockchain-node:
        condition: service_started

  # 前端服務
  frontend:
    build: ./frontend
    container_name: gtn-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./frontend:/app
    restart: unless-stopped
    networks:
      - gtn-network
    depends_on:
      api:
        condition: service_started

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: gtn-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - gtn-network

  # 區塊鏈節點資料庫
  node0-db:
    image: postgres:14.9-alpine3.18
    container_name: gtn-node0-db
    networks:
      postchain-mainnet:
        ipv4_address: 172.31.0.4
    volumes:
      - ./blockchain/data/node0:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--lc-collate=c.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8
      - POSTGRES_USER=postchain
      - POSTGRES_PASSWORD=postchain
    ports:
      - "5440:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  node1-db:
    image: postgres:14.9-alpine3.18
    container_name: gtn-node1-db
    networks:
      postchain-mainnet:
        ipv4_address: 172.31.0.5
    volumes:
      - ./blockchain/data/node1:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--lc-collate=c.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8
      - POSTGRES_USER=postchain
      - POSTGRES_PASSWORD=postchain
    ports:
      - "5441:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  node2-db:
    image: postgres:14.9-alpine3.18
    container_name: gtn-node2-db
    networks:
      postchain-mainnet:
        ipv4_address: 172.31.0.6
    volumes:
      - ./blockchain/data/node2:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--lc-collate=c.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8
      - POSTGRES_USER=postchain
      - POSTGRES_PASSWORD=postchain
    ports:
      - "5442:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  node3-db:
    image: postgres:14.9-alpine3.18
    container_name: gtn-node3-db
    networks:
      postchain-mainnet:
        ipv4_address: 172.31.0.7
    volumes:
      - ./blockchain/data/node3:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--lc-collate=c.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8
      - POSTGRES_USER=postchain
      - POSTGRES_PASSWORD=postchain
    ports:
      - "5443:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 區塊鏈節點
  blockchain-node:
    image: registry.gitlab.com/chromaway/core-tools/chromia-cli/chr:0.13.0
    container_name: gtn-blockchain-node
    networks:
      postchain-mainnet:
        ipv4_address: 172.31.0.9
      gtn-network:
    ports:
      - "7731:7740"
      - "7750:7750"
    volumes:
      - ./blockchain:/usr/app
    command: chr node start -bc ./build/contract.xml -np ./conf/node1.properties
    restart: unless-stopped
    depends_on:
      node1-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"

networks:
  gtn-network:
    driver: bridge
  postchain-mainnet:
    external: true
    ipam:
      driver: bridge
      config:
        - subnet: 172.31.0.0/24